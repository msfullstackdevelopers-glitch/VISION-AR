name: visionar
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to:
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  pinput: ^3.0.1

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_database: ^12.4.7
  firebase_storage: ^13.4.6

  model_viewer_plus: ^1.10.0
  shared_preferences: ^2.5.5
  flutter_3d_controller: ^2.3.0
  http: ^1.6.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.0
  mobile_scanner: ^6.0.2
  video_player: ^2.11.1
  image_picker: ^1.1.2
  webview_flutter_web: ^0.2.3+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  firebase_core_web: 3.10.0

flutter:

  uses-material-design: true

  assets:

    - assets/images/splash_bg_tablet.png
    - assets/images/splash_bg_desktop.png
    - assets/images/splash_bg_mobile.png
    - assets/images/login_bg_mobile.png
    - assets/images/login_bg_tablet.png
    - assets/images/login_bg_desktop.png
    - assets/vr_icon.png
    - assets/logo.png


# ---------------------------------------------------------------
# flutter_launcher_icons config
# ---------------------------------------------------------------
# Generates the app icon for every platform from a single source
# image (assets/logo.png), replacing Flutter's default icon.
#
# `web:` was added here (flutter_launcher_icons 0.13+ supports it) so
# `flutter pub run flutter_launcher_icons` now ALSO regenerates:
#   - web/favicon.png
#   - web/icons/Icon-192.png
#   - web/icons/Icon-512.png
#   - web/icons/Icon-maskable-192.png
#   - web/icons/Icon-maskable-512.png
# No manual file replacement needed anymore.
#
# background_color/theme_color below match this app's dark UI
# (#0B0F14, used across model_full_view_screen.dart /
# models_list_screen.dart) - change these if your brand color
# differs. `min_sdk_android` is left at the package default (21).
# ---------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0B0F14"
    theme_color: "#0B0F14"